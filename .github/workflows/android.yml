name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_CLIENT_ID: ${{ secrets.GIT_GUI_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: |
          if [ -n "$GITHUB_CLIENT_ID" ]; then
            gradle :app:assembleDebug --stacktrace -PGITHUB_CLIENT_ID="$GITHUB_CLIENT_ID"
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GIT-GUI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/zipalign
