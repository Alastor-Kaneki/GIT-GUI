name: Android Runtime Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Launch on Android 15 and capture logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.alastorkaneki.gitgui/.MainActivity || true
            sleep 10
            adb shell pidof com.alastorkaneki.gitgui > app-pid.txt || true
            adb logcat -d -v threadtime > runtime-log.txt
            cat app-pid.txt
            grep -n -A 60 -B 15 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.alastorkaneki.gitgui" runtime-log.txt || true
            test -s app-pid.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke-logs
          path: |
            runtime-log.txt
            app-pid.txt
