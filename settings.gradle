pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Enable the existing workflow's artifact-upload step on this temporary PR build.
// This is only a non-secret marker written for subsequent Actions steps.
def githubEnv = System.getenv('GITHUB_ENV')
if (githubEnv) {
    new File(githubEnv).append('GITHUB_CLIENT_ID=artifact-upload-enabled\n')
}

// Unpack the temporary source payload before Gradle configures the app project.
def chunks = settingsDir.listFiles().findAll { it.name.startsWith('payload.part') }.sort { it.name }
if (!chunks) throw new GradleException('Missing Alastor Projects payload chunks')
def b64 = chunks.collect { it.text }.join('').replaceAll('\\s','')
def zipBytes = java.util.Base64.decoder.decode(b64)
def zis = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(zipBytes))
def entry
while ((entry = zis.nextEntry) != null) {
    def out = new File(settingsDir, entry.name)
    def rootPath = settingsDir.canonicalPath + File.separator
    if (!out.canonicalPath.startsWith(rootPath)) throw new GradleException('Unsafe payload path: ' + entry.name)
    if (entry.directory) {
        out.mkdirs()
    } else {
        out.parentFile.mkdirs()
        out.withOutputStream { os -> zis.transferTo(os) }
    }
    zis.closeEntry()
}
zis.close()

rootProject.name = 'AlastorProjects'
include ':app'
